[package]
name = "omlx-top"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Read-only macOS terminal monitor for oMLX resource usage"
license = "BSD-3-Clause"
repository = "https://github.com/athoune/omlx-top"
readme = "README.md"
keywords = ["mlx", "omlx", "monitor", "tui", "macos"]
categories = ["command-line-utilities", "development-tools::profiling"]
exclude = ["/.github", "/dist"]

[[bin]]
name = "omlx-top"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
